<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2e3a33">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PocketSci">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="description" content="PocketSci: a pocket scientific calculator for your phone and computer. Fractions, DMS, statistics, 3 memories and the classic AOS order of operations.">
  <title>PocketSci</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='5' y='1.5' width='22' height='29' rx='5' fill='%232e3a33'/%3E%3Crect x='8' y='5' width='16' height='7' rx='1.5' fill='%23b9c4ad'/%3E%3Crect x='8' y='15' width='4' height='3' rx='1' fill='%2386cdb9'/%3E%3Crect x='14' y='15' width='4' height='3' rx='1' fill='%23d4dad0'/%3E%3Crect x='20' y='15' width='4' height='3' rx='1' fill='%23c4a03a'/%3E%3Crect x='8' y='20' width='4' height='3' rx='1' fill='%23d4dad0'/%3E%3Crect x='14' y='20' width='4' height='3' rx='1' fill='%23d4dad0'/%3E%3Crect x='20' y='20' width='4' height='3' rx='1' fill='%23c4a03a'/%3E%3Crect x='8' y='25' width='4' height='3' rx='1' fill='%23d4dad0'/%3E%3Crect x='14' y='25' width='4' height='3' rx='1' fill='%23d4dad0'/%3E%3Crect x='20' y='25' width='4' height='3' rx='1' fill='%23c4a03a'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600&family=Barlow+Semi+Condensed:ital,wght@0,500;0,600;0,700;1,700&display=swap">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="calc" id="calc" aria-label="PocketSci scientific calculator">
    <header class="top">
      <button class="hist-btn" id="histBtn" type="button" aria-expanded="false" aria-controls="sheet">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 7v5l3 2"/>
        </svg>
        <span>History</span>
      </button>
      <span class="brand" aria-hidden="true">PocketSci</span>
      <button class="key k-clear" type="button" data-id="onac" aria-label="On, all clear" title="On / all clear (resets memories and statistics)">ON/AC</button>
    </header>

    <section class="lcd" aria-label="Display">
      <div class="ind" id="indTop" aria-hidden="true"></div>
      <div class="readout" id="readout" role="status" aria-live="polite">
        <span class="line" id="line"><span class="prefix" id="prefix"></span><span class="num" id="num"></span><span class="exp" id="exp"></span></span>
      </div>
      <div class="ind" id="indBot" aria-hidden="true"></div>
    </section>

    <div class="padwrap">
      <div class="pad" id="pad" role="group" aria-label="Keypad"></div>

      <section class="sheet" id="sheet" aria-label="History" aria-hidden="true">
        <div class="sheet-head">
          <h2>History</h2>
          <button type="button" id="histClear">Clear</button>
          <button type="button" id="histClose" aria-label="Close history">✕</button>
        </div>
        <p class="hint" id="histHint">Tap a result to reuse it.</p>
        <ol class="hist-list" id="histList"></ol>
        <p class="empty" id="histEmpty">No calculations yet. Results appear here when you press =.</p>
      </section>
    </div>
  </main>
</body>
</html>
